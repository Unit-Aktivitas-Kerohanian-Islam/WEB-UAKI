services:
  # ==============================================================================
  # DATABASE: PostgreSQL (Production)
  # ==============================================================================
  db:
    image: postgres:15-alpine
    container_name: uaki_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "127.0.0.1:5432:5432"   # Hanya expose ke localhost, tidak ke publik!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # APPLICATION: Buffalo Go App
  # ==============================================================================
  app:
    image: ${IMAGE_TAG:-ghcr.io/unit-aktivitas-kerohanian-islam/web-uaki:latest}
    container_name: WEB-UAKI
    restart: always
    ports:
      - "127.0.0.1:3000:3000"   # Hanya expose ke localhost, Nginx yang handle publik!
    environment:
      GO_ENV: production
      PORT: "3000"
      ADDR: "0.0.0.0"
      # Database
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_DATABASE}?sslmode=disable
      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXP_TIME: ${JWT_EXP_TIME}
      # Biznet NEO Object Storage
      NOS_ENDPOINT: ${NOS_ENDPOINT}
      NOS_ACCESS_KEY: ${NOS_ACCESS_KEY}
      NOS_SECRET_KEY: ${NOS_SECRET_KEY}
      NOS_BUCKET: ${NOS_BUCKET}
      NOS_REGION: ${NOS_REGION}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
